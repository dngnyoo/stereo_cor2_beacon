experiment:
  name: cor2_strict_baseline
  date: '20240503'
  source: dual_archive
input:
  preprocessed_dir: /home/aababc/stereo_cor2_clean/runs/data_prep_20240503_local/preprocessed
  spatial_metrics_csv: runs/20240503_p16_spatial/p16_spatial_metrics.csv
visualization:
  default: 'off'
preprocessing:
  method: dual_archive_rd
  visualization:
    mode: 'off'
detection:
  method: d4
  denoiser: gaussian
  score_mode: abs
  gaussian_sigma: 1.0
  threshold_method: causal_t24
  t24_mad_multiplier: 3.0
  floor_mode: outer_p95
  absolute_p04_floor: 0.5
  qc:
    global_activation_threshold: 0.7
    normalized_weighted_tile_variance_min: 1.5
tracking:
  method: a5b
  pre_size:
    connectivity: 8
    min_component_patches: 8
  parameters:
    max_missed_frames: 1
    terminate_on_qc: true
    outward_gate_enabled: true
    outward_gate_tolerance_px: 4.0
association:
  method: identity
gates:
  birth_max_radius_px: 30.0
  persistence:
    method: consecutive_size_qualified
    min_detected_patches: 10
    min_observed_pairs: 3
  outward_split:
    enabled: false
recovery:
  method: signed_dynamic_pa
  inner_radius_px: 16.326
  radial_window_px: 13.35
  pa_margin_deg: 5.0
  gaussian_sigma: 1.0
segmentation:
  method: island_first
catalog:
  method: event_kinematics
  rsun_px: 8.51923291479889
  solar_radius_km: 695700.0
validation:
  method: seeds
  catalogs:
  - SEEDS
  seeds_frames_csv: data/catalogs/seeds/20240503/seeds_frames.csv
  max_time_delta_sec: 900
  min_mean_iou: 0.1
  min_common_frames: 1
