experiment:
  name: cor2_20101212_s1_seed_birth
  date: "20101212"
  source: dual_archive

input:
  warmup_days: 2

visualization:
  default: "off"

preprocessing:
  method: dual_archive_rd

detection:
  method: d4
  denoiser: gaussian
  score_mode: abs
  gaussian_sigma: 1.0
  threshold_method: causal_t24
  t24_mad_multiplier: 3.0
  floor_mode: outer_p95
  absolute_p04_floor: 0.5
  qc:
    global_activation_threshold: 0.70
    normalized_weighted_tile_variance_min: 1.5

tracking:
  method: s1
  pre_size:
    connectivity: 8
    min_component_patches: 8
  parameters:
    patch_size: 4
    max_cadence_gap_sec: 4500.0
    outward_gate_enabled: true
    outward_gate_tolerance_px: 4.0
    min_pa_width_deg: 8.0
    ema_alpha: 0.1
    birth_gate_threshold_px: 30.0
    seed_min_radius_px: 22.0
    seed_max_radius_px: 30.0
    seed_score_cutoff: 0.0
    strict_seeded_birth: true
    default_roi_half_width_deg: 15.0
    roi_padding_deg: 5.0
    max_missed_frames: 3
    terminate_on_qc: false

association:
  method: identity

gates:
  birth_max_radius_px: 30.0
  persistence:
    method: consecutive_size_qualified
    min_detected_patches: 10
    min_observed_pairs: 3
  outward_split:
    enabled: false

recovery:
  method: signed_dynamic_pa

segmentation:
  method: island_first

catalog:
  method: event_kinematics

validation:
  method: seeds
  catalogs: [SEEDS]
